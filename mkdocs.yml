site_name: seqrepo-rest-service
repo_url: https://github.com/biocommons/seqrepo-rest-service
site_url: https://biocommons.github.io/seqrepo-rest-service
site_description: Package Description
site_author: Biocommons Contributors
edit_uri: edit/main/docs/
repo_name: biocommons/seqrepo-rest-service
copyright: Maintained by <a href="https://biocommons.com">biocommons</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/biocommons/example"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/biocommons/seqrepo-rest-service
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/seqrepo-rest-service

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
